# Frontend nginx — SPA + Convex backend proxy.
# Serves the static Vite bundle AND reverse-proxies the Convex backend surfaces
# so the public origin (https://<host>) is the ONE origin for app + Convex:
#   /api/*            -> Convex client API (REST RPC + sync WebSocket)  backend:3210
#   /.well-known/*    -> Convex Auth OIDC discovery + JWKS               backend:3211
#   http.ts routes    -> Convex HTTP actions                             backend:3211
#   /version          -> Convex client API version                       backend:3210
#   everything else   -> SPA (try_files -> index.html)
# `backend` is the sibling Convex service in the same compose; internal ports
# 3210/3211 are fixed by the convex-backend image (host-published ports differ
# per stack but the frontend never needs them).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # http.ts route -> Convex HTTP actions (backend:3211)
    location ~ ^/admin/ {
        proxy_pass http://backend:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Convex client API (REST RPC + sync WebSocket) -> backend:3210
    location /api/ {
        proxy_pass http://backend:3210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Convex Auth OIDC discovery + JWKS -> backend:3211
    location /.well-known/ {
        proxy_pass http://backend:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client API version check -> backend:3210
    location = /version {
        proxy_pass http://backend:3210;
        proxy_set_header Host $host;
    }

    # SPA fallback: any client-side route serves index.html for React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache the HTML shell, so new deploys take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
