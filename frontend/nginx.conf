server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any client-side route serves index.html for React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache the HTML shell, so new deploys take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
